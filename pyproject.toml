[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "molecular-transport-audit"
version = "0.1.0"
description = "A reproducible bioinformatics framework for auditing molecular representation and clinical outcome transport."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "scipy",
    "scikit-learn",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]


[tool.setuptools]
package-dir = {"" = "core"}


[tool.setuptools.packages.find]
where = ["core"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]
addopts = "-ra"


[tool.coverage.run]
source = ["transport_audit"]


[tool.coverage.report]
show_missing = true
skip_covered = false
